name: Build Fabric 

on:
  workflow_dispatch:
  push:
    branches: [main, 26.3, neoforge, 'arena/**']

jobs:
  debug_build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          (./gradlew buildAndCollect+All || ./gradlew buildAndCollect || ./gradlew build) 2>&1 | tee /tmp/build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ORG_GRADLE_PROJECT_gpr.user: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gpr.key: ${{ secrets.GPR_KEY }}

      - name: Report failure as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '```'
            grep -A 14 "What went wrong" /tmp/build.log | tail -n 60
            echo "--- tail ---"
            tail -n 40 /tmp/build.log
            echo '```'
          } > /tmp/report.txt
          python3 - <<'EOF' > /tmp/report.json
          import json
          print(json.dumps({"body": open("/tmp/report.txt").read()[:60000]}))
          EOF
          gh api -X POST repos/${{ github.repository }}/commits/${{ github.sha }}/comments --input /tmp/report.json

      - name: List all files (Debug)
        run: |
          echo "Listing all .jar files in the project:"
          find . -name "*.jar"

      - name: Capture ALL .jar files
        uses: actions/upload-artifact@v4
        with:
          name: All-Jars-Found
          path: "**/*.jar"
