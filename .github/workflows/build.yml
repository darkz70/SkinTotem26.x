name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, 26.3, neoforge, 'arena/**']
  pull_request:
    branches: [main, 26.3, neoforge]

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug_build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [fabric, neoforge]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Restore Gradle caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/wrapper
          key: gradle2-${{ matrix.platform }}-${{ hashFiles('gradle.properties', 'versions/*/gradle.properties', 'settings.gradle', 'build.gradle') }}
          restore-keys: |
            gradle2-${{ matrix.platform }}-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.platform }}
        run: |
          set -o pipefail
          GRADLE_ARGS="-Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000 --stacktrace"
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt"
            # Loom иногда не может пересоздать свой кэш ("Incompatible Gradle cache") и роняет
            # конфигурацию проекта, а вместе с ней — регистрацию задач moddevgradle. Кэшей у него три:
            # в домашней папке Gradle, в .gradle проекта (переживает попытки внутри джоба) и в build/.
            ./gradlew --stop >/dev/null 2>&1 || true
            rm -rf ~/.gradle/caches/fabric-loom ~/.gradle/caches/*/fabric-loom \
                   .gradle/loom-cache build/loom-cache versions/*/build/loom-cache 2>/dev/null || true
            if ./gradlew "buildAndCollect+${{ matrix.platform }}+All" -Pci_loader=${{ matrix.platform }} $GRADLE_ARGS 2>&1 | tee /tmp/build.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if grep -qE "Incompatible Gradle cache|createMinecraftArtifacts' not found" /tmp/build.log; then
              # Mossy тянет Fabric Loom как 1.17-SNAPSHOT: в кэше Gradle может осесть состояние от
              # другой сборки снапшота, и тогда loom не поднимает Minecraft (NPE в DependenciesManager).
              # Вычищаем ВЕСЬ кэш Gradle, чтобы следующая попытка стартовала как на чистой машине.
              echo "Loom cache flake detected, wiping the whole Gradle cache and retrying..."
              ./gradlew --stop >/dev/null 2>&1 || true
              rm -rf ~/.gradle/caches ~/.gradle/daemon .gradle versions/*/.gradle 2>/dev/null || true
              sleep 5
              continue
            fi
            # Повторяем только сетевые сбои сторонних maven-зеркал, ошибки кода повторять бессмысленно.
            if ! grep -qE "kikugie\.dev|failed to respond|Could not (GET|HEAD)|Connection (timed out|reset)" /tmp/build.log; then
              exit 1
            fi
            echo "Network failure detected, retrying in 120s..."
            sleep 120
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ORG_GRADLE_PROJECT_gpr.user: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gpr.key: ${{ secrets.GPR_KEY }}

      - name: Save Gradle caches
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/wrapper
          key: gradle2-${{ matrix.platform }}-${{ hashFiles('gradle.properties', 'versions/*/gradle.properties', 'settings.gradle', 'build.gradle') }}-${{ github.run_id }}

      - name: Report build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI failure (${{ matrix.platform }})"
            echo
            echo '```'
            grep -n -E "Incompatible Gradle cache|at net\.fabricmc|at dev\.kikugie|at net\.lopymine|Caused by:|What went wrong" -A 3 /tmp/build.log | head -c 30000
            echo '```'
          } > /tmp/report.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/report.md

      - name: List all files (Debug)
        run: |
          echo "Listing all .jar files in the project:"
          find . -name "*.jar" -not -path "*/.gradle/*"

      - name: Capture ALL .jar files
        uses: actions/upload-artifact@v4
        with:
          name: All-Jars-${{ matrix.platform }}
          path: "**/*.jar"
