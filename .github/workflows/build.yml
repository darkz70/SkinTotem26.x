name: Build Fabric 

on:
  workflow_dispatch:
  push:
    branches: [main, 26.3, neoforge, 'arena/**']

jobs:
  debug_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          (./gradlew buildAndCollect+All || ./gradlew buildAndCollect || ./gradlew build) 2>&1 | tee /tmp/build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ORG_GRADLE_PROJECT_gpr.user: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gpr.key: ${{ secrets.GPR_KEY }}

      # Временный шаг: хвост лога сборки публикуется комментарием к коммиту,
      # потому что скачивание логов Actions недоступно из рабочей среды агента.
      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -nE "error:|warning: \[|FAILURE|What went wrong|Caused by|Could not (find|resolve)" /tmp/build.log | tail -c 20000 > /tmp/errors.txt || true
          { echo "### Build failure digest"; echo; echo '```'; cat /tmp/errors.txt; echo '```'; echo; echo "<details><summary>tail</summary>"; echo; echo '```'; tail -c 25000 /tmp/build.log; echo '```'; echo "</details>"; } > /tmp/report.md
          jq -Rs '{body: .}' /tmp/report.md > /tmp/report.json
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/report.json

      - name: List all files (Debug)
        run: |
          echo "Listing all .jar files in the project:"
          find . -name "*.jar"

      - name: Capture ALL .jar files
        uses: actions/upload-artifact@v4
        with:
          name: All-Jars-Found
          path: "**/*.jar"
