name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, 26.3, neoforge, 'arena/**']

jobs:
  debug_build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [fabric, neoforge]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.platform }}
        run: ./gradlew "buildAndCollect+${{ matrix.platform }}+All" -Pci_loader=${{ matrix.platform }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ORG_GRADLE_PROJECT_gpr.user: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gpr.key: ${{ secrets.GPR_KEY }}

      - name: List all files (Debug)
        run: |
          echo "Listing all .jar files in the project:"
          find . -name "*.jar"

      - name: Capture ALL .jar files
        uses: actions/upload-artifact@v4
        with:
          name: All-Jars-${{ matrix.platform }}
          path: "**/*.jar"
