name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, 26.2]
  pull_request:
    branches: [main, 26.2]

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Restore Gradle caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/wrapper
          key: gradle2-fabric-${{ hashFiles('gradle.properties', 'versions/*/gradle.properties', 'settings.gradle', 'build.gradle') }}
          restore-keys: |
            gradle2-fabric-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build fabric
        run: |
          set -o pipefail
          GRADLE_ARGS="-Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000"
          for attempt in 1 2 3; do
            echo "::group::Build attempt $attempt"
            # Loom иногда не может пересоздать свой кэш ("Incompatible Gradle cache") и роняет
            # конфигурацию проекта. Кэшей у него три: в домашней папке Gradle, в .gradle проекта
            # (переживает попытки внутри джоба) и в build/.
            ./gradlew --stop >/dev/null 2>&1 || true
            rm -rf ~/.gradle/caches/fabric-loom ~/.gradle/caches/*/fabric-loom \
                   .gradle/loom-cache build/loom-cache versions/*/build/loom-cache 2>/dev/null || true
            if ./gradlew buildAndCollect+All $GRADLE_ARGS 2>&1 | tee /tmp/build.log || \
               ./gradlew buildAndCollect $GRADLE_ARGS 2>&1 | tee -a /tmp/build.log || \
               ./gradlew build $GRADLE_ARGS 2>&1 | tee -a /tmp/build.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if grep -qE "Incompatible Gradle cache|createMinecraftArtifacts' not found" /tmp/build.log; then
              # Mossy тянет Fabric Loom как снапшот: в кэше Gradle может осесть состояние от другой
              # сборки снапшота, и тогда loom не поднимает Minecraft. Вычищаем ВЕСЬ кэш Gradle.
              echo "Loom cache flake detected, wiping the whole Gradle cache and retrying..."
              ./gradlew --stop >/dev/null 2>&1 || true
              rm -rf ~/.gradle/caches ~/.gradle/daemon .gradle versions/*/.gradle 2>/dev/null || true
              sleep 5
              continue
            fi
            # Повторяем только сетевые сбои сторонних maven-зеркал, ошибки кода повторять бессмысленно.
            if ! grep -qE "kikugie\.dev|failed to respond|Could not (GET|HEAD)|Connection (timed out|reset)" /tmp/build.log; then
              { echo '### Build failed — last 120 lines of log'; echo '```'; tail -120 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || tail -120 /tmp/build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              exit 1
            fi
          done
          echo "All build attempts failed"
          { echo '### All build attempts failed — last 120 lines'; echo '```'; tail -120 /tmp/build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ORG_GRADLE_PROJECT_gpr.user: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gpr.key: ${{ secrets.GPR_KEY }}

      - name: Save Gradle caches
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/wrapper
          key: gradle2-fabric-${{ hashFiles('gradle.properties', 'versions/*/gradle.properties', 'settings.gradle', 'build.gradle') }}-${{ github.run_id }}

      - name: Collect the mod jar
        run: |
          mkdir -p dist
          find versions/*/build/libs -name "SkinTotem-*.jar" ! -name "*-sources.jar" -exec cp {} dist/ \;
          echo "Собранные моды / built mod jars:"
          ls -l dist

      # В артефакт кладётся только сам мод: minecraft-patched-*.jar, jlayer-*.jar и прочее,
      # что лежит в дереве сборки, модами не являются и в mods/ не ставятся.
      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: SkinTotem-fabric
          path: dist/*.jar
          if-no-files-found: error
