plugins {
	id "net.lopymine.mossy-plugin-core" version "$mossy_plugin_version"
}

mossyDependencies {
	minecraft = stonecutter.current.project.substring(stonecutter.current.project.indexOf("-") + 1)
	lombok = prop("base.lombok_version")

	fabricApi = prop("build.fabric_api")
	fabricLoader = prop("build.fabric_loader")

//	forge = prop("build.forge")
//
//	neoForge = prop("build.neoforge")
//	parchment = prop("build.parchment")

	additional {
		//override("modCompileOnly", "yacl")
		disable("cit-resewn")
	}
}

repositories {
	// Mixin^2
	maven {
		name = "Mixin Squared"
		url = "https://maven.bawnorton.com/releases"
	}
	// Emotecraft API
	maven {
		name = "KosmX"
		url = "https://maven.kosmx.dev/"
	}
	// Player Animation Library (транзитивная зависимость Emotecraft)
	maven {
		name = "Redlance"
		url = "https://repo.redlance.org/public"
	}
}

dependencies {
	// Mixin^2
	include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${prop("build.mixin_squared")}")))

	// Lombok (explicit fallback in case mossyDependencies' automatic wiring doesn't apply)
	compileOnly "org.projectlombok:lombok:${prop("base.lombok_version")}"
	annotationProcessor "org.projectlombok:lombok:${prop("base.lombok_version")}"

	// Emotecraft: только для компиляции — мод полностью опционален в рантайме.
	// emotesAPI транзитивно тянет PlayerAnimationLibCore, MC-часть библиотеки нужна отдельно.
	compileOnly("io.github.kosmx.emotes:emotesAPI:${prop("compat.emotecraft_api")}") {
		exclude group: "com.plasmoverse"
	}
	compileOnly "com.zigythebird.playeranim:PlayerAnimationLibCommon:${prop("compat.player_anim_lib")}"

	// MP3 без внешних программ: декодер JLayer кладётся внутрь jar (JiJ), лицензия LGPL 2.1.
	include(implementation("javazoom:jlayer:${prop("base.jlayer_version")}"))

	// CIT Resewn
	def cit = prop("dep.cit-resewn")
	if (cit != "unknown") {
		modImplementation "maven.modrinth:cit-resewn:${cit}"
		modImplementation "maven.modrinth:cit-resewn-defaults:${cit}"
	}
}

stonecutter {
	replacements.string(current.parsed >= "26.1") {
		replace("atlas.location()", "atlas.location()")
	}
}

String prop(String key) {
	return findProperty(key).toString()
}
