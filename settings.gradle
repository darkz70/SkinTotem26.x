pluginManagement {
	repositories {
		// Сначала крупные зеркала: они отдают gson, foojay, plexus и прочие "обычные" артефакты
		// плагинов. Так сборка не падает, когда маленький сторонний репозиторий временно недоступен.
		mavenCentral()
		gradlePluginPortal()
		maven {
			name "Fabric"
			url "https://maven.fabricmc.net/"
		}
		maven {
			name "Mossy Projects"
			url "https://maven.lopymine.net/releases"
		}
		maven {
			name "NeoForged"
			url "https://maven.neoforged.net/releases"
		}
		// Зеркала Kiku регулярно не отвечают, а отключённый по таймауту репозиторий валит
		// резолв целиком. Поэтому к ним обращаемся только за самим Stonecutter.
		maven {
			name "Kiku Releases"
			url "https://maven.kikugie.dev/releases"
			content {
				includeGroupByRegex("dev\\.kikugie.*")
			}
		}
		maven {
			name "Kiku Snapshots"
			url "https://maven.kikugie.dev/snapshots"
			content {
				includeGroupByRegex("dev\\.kikugie.*")
			}
		}
		mavenLocal()
	}
}

plugins {
	id "dev.kikugie.stonecutter" version "0.9"
	id "net.lopymine.mossy-plugin-settings" version "$mossy_plugin_version"
}
